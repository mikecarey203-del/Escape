<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no"><meta name="theme-color" content="#6c4778"><title>Lullaby's Donuts Escape</title><style>
*{box-sizing:border-box}html,body{margin:0;height:100%;font-family:system-ui,-apple-system,sans-serif;background:#211725;color:#fff;overflow:hidden}button,input{font:inherit;touch-action:manipulation}.hide{display:none!important}
#gate{position:fixed;inset:0;display:grid;place-items:center;padding:20px;background:radial-gradient(circle at top,#d5a7df,#714b7e 55%,#241927);z-index:20}.gate{width:min(92vw,480px);background:#fff8fb;color:#4d3152;padding:28px;border-radius:28px;text-align:center;box-shadow:0 20px 70px #0008}.gate .hero{font-size:68px}.gate h1{margin:4px}.gate input{width:100%;padding:15px;border:2px solid #bb8fc5;border-radius:14px;text-align:center}.gate button,.btn{border:0;border-radius:13px;padding:11px 14px;background:#f0b6d2;color:#44273f;font-weight:800;box-shadow:0 3px 0 #96698d}.gate button{width:100%;margin-top:10px}
#app{height:100svh;display:grid;grid-template-rows:auto 1fr auto}.top,.bottom{display:flex;align-items:center;gap:8px;background:#3c2943;padding:8px 10px}.top{padding-top:max(8px,env(safe-area-inset-top))}.bottom{padding-bottom:max(8px,env(safe-area-inset-bottom))}.top h2{margin:0;flex:1;text-align:center;font-size:15px}.stageWrap{display:grid;place-items:center;min-height:0}.stage{position:relative;width:min(100vw,150svh);aspect-ratio:3/2;max-height:100%;overflow:hidden;border-radius:18px;background:linear-gradient(145deg,#f3c5dd,#c5a8d8 52%,#f1d8b5)}.art{position:absolute;inset:0;display:grid;place-items:center;text-align:center;padding:8%;color:#573c5e}.art:before{content:"";position:absolute;inset:5%;border:7px solid #fff7;border-radius:28px}.emoji{font-size:clamp(70px,14vw,160px)}.art h1{font-size:clamp(24px,5vw,62px);margin:0;text-shadow:0 2px #fff8}.art p{font-size:clamp(13px,2.2vw,23px)}
.hot{position:absolute;width:11%;aspect-ratio:1;border-radius:50%;border:3px solid white;background:#ffd05ccc;color:#573c5e;font-size:clamp(18px,4vw,38px);font-weight:900;box-shadow:0 0 0 6px #fff4,0 0 22px #ffdc6c;transform:translate(-50%,-50%)}.hot.done{background:#b8e5c3}.dialog{flex:1;min-width:0}.dialog b{display:block}.dialog span{font-size:12px;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.inv{font-size:11px;max-width:28vw;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.overlay{position:fixed;inset:0;z-index:10;background:#000b;display:grid;place-items:center;padding:18px}.card{width:min(94vw,560px);max-height:88svh;overflow:auto;background:#fff8fb;color:#412b47;border-radius:24px;padding:22px}.choices,.rooms{display:grid;gap:9px}.choices button,.rooms button{padding:13px;border:0;border-radius:12px;background:#ead6ef;color:#43294a;font-weight:800}.rooms button{text-align:left}.locked{opacity:.42}
@media(orientation:portrait){.stageWrap:after{content:"↻ Turn sideways for the full bakery";position:absolute;bottom:18%;padding:9px 12px;background:#000c;border-radius:12px}}
</style></head><body>
<div id="gate"><div class="gate"><div class="hero">🐔🍩</div><h1>Lullaby's Donuts</h1><p>Keeping Up with the Plushies Escape Room</p><input id="pw" type="password" placeholder="Secret password"><button id="enter">Enter Bakery</button><p id="gm">Lullaby: “Only da trusted chippen committee gets in!”</p></div></div>
<div id="app" class="hide"><div class="top"><button class="btn" id="menu">☰ Rooms</button><h2 id="title"></h2><button class="btn" id="hint">💡 <span id="hc"></span></button></div><div class="stageWrap"><div class="stage" id="stage"></div></div><div class="bottom"><button class="btn" id="back">← Back</button><div class="dialog"><b id="speaker">Lullaby</b><span id="dialog">Hellwo! Find da clues!</span></div><div class="inv" id="inv">🎒 Empty</div></div></div>
<div id="modal" class="overlay hide"><div class="card"><h2 id="mh"></h2><p id="mt"></p><div id="choices" class="choices"></div><button class="btn" id="close" style="margin-top:14px">← Back</button></div></div>
<div id="roomMenu" class="overlay hide"><div class="card"><h2>Bakery Map</h2><div id="roomList" class="rooms"></div><button class="btn" id="closeMenu" style="margin-top:14px">Close</button><button class="btn" id="restart" style="margin-top:14px">Restart</button></div></div>
<script>
const R=[
["Outside — Lullaby's Donuts","🏪","The pastel bakery is locked. Tiny chicken decorations seem suspicious.",[["Chicken Sign","Lullaby's favorite little creatures are…?","Chicken",["Chicken","Night Bears","Coffee"],"Chicken Token",23,57],["Heart Doormat","Pedro's note says: 2 chipens + 2 chipens = ?","4",["3","4","22"],"Pink Key",73,70]]],
["Front Counter","🍩","Warm donut cases glow. Pedro left his handwriting on the register.",[["Pedro's Note","What keeps Pedro going when it's 3 in da morning?","Coffee",["Coffee","Sprinkles","Ice cream"],"Coffee Token",26,35],["Register","Who has final control of Lullaby's business?","Lullaby",["Mr. Bang","Pedro","Lullaby"],"Register Key",72,58]]],
["Outdoor Dining Garden","🌷","Fairy lights twinkle. Something gummy is hiding near a planter.",[["Night Bear","Bango says gummy Night Bears taste like…","Cotton candy",["Coffee","Cotton candy","Chicken"],"Gummy Bear Token",25,62],["Bango Clue","Who protects Lullaby from the Night Bears?","Bango",["Timmy","Pedro","Bango"],"Bango Badge",73,34]]],
["Main Dining Room","🛋️","Family portraits watch over a room full of tiny chicken décor.",[["Portrait Wall","Timmy has 1 eye. Lullaby, Pedro and Bango have 2 each. Total?","7",["6","7","8"],"Number 7 Tile",27,36],["Tiny Fedora","Who wears a small black fedora when he's with Mr. Bang?","One-Eyed Timmy",["Bango","One-Eyed Timmy","Pedro"],"Fedora Token",72,66]]],
["Kitchen & Baking Area","🧁","The recipe card is written in Lullaby math.",[["Recipe Card","2 sprinkles + 3 sugar + 1 extra wuv = ?","6",["5","6","7"],"Recipe Card 6",25,64],["Special Tray","Which silly menu item sounds most like Lullaby?","Chicken donuts",["Plain toast","Chicken donuts","Black coffee"],"Chicken Donut",73,35]]],
["Inventory Room","📦","Boxes read: DONUTS, CHIPENS, and DEFINITELY NOT NIGHT BEARS.",[["Gold Envelope","Mr. Bang financed the business. Does he expect ownership or repayment?","No",["Yes","No","Only donuts"],"Gold Heart Key",27,38],["Ownership Ledger","Who owns Lullaby's Donuts?","Lullaby",["Mr. Bang","Bango","Lullaby"],"Ownership Seal",73,64]]],
["Lullaby's Office","💜","Big dreams. Sweet donuts. Happier days. Chicken doodles cover the desk.",[["Executive Folder","What creature appears all over Lullaby's plans?","Chicken",["Chicken","Bear","Duck"],"Employee Badge",26,62],["Business Plan","Who makes the final decisions for the donut shop?","Lullaby",["Pedro","Lullaby","Mr. Bang"],"Office Clearance",73,34]]],
["Employee Break Room — Final Escape","🔐","Pedro's coffee and Bango's gummy wrappers sit beside the last door.",[["Night Bear Warning","Who fights — and sometimes eats — the Night Bears?","Bango",["Bango","Pedro","Timmy"],"Final Donut Key",26,38],["Pedro's Mug","Match Pedro with the thing most associated with him here.","Coffee",["Chicken","Coffee","Gummy Bear"],"Final Code",73,64]]]];
let S=JSON.parse(localStorage.getItem("lullabyEscape")||"null")||{room:0,unlock:1,solved:{},inv:[],hints:{}};const $=x=>document.getElementById(x);const save=()=>localStorage.setItem("lullabyEscape",JSON.stringify(S));const done=i=>R[i][3].every((_,j)=>S.solved[i+"-"+j]);
function render(){let r=R[S.room];$("title").textContent=(S.room+1)+"/8 · "+r[0];$("stage").innerHTML='<div class="art"><div><div class="emoji">'+r[1]+'</div><h1>'+r[0]+'</h1><p>'+r[2]+'</p></div></div>';r[3].forEach((p,j)=>{let b=document.createElement("button");b.className="hot"+(S.solved[S.room+"-"+j]?" done":"");b.style.left=p[5]+"%";b.style.top=p[6]+"%";b.textContent=S.solved[S.room+"-"+j]?"✓":"✦";b.onclick=()=>inspect(j);$("stage").appendChild(b)});$("hc").textContent=(3-(S.hints[S.room]||0))+"/3";$("inv").textContent=S.inv.length?"🎒 "+S.inv.slice(-2).join(" · "):"🎒 Empty";save()}
function inspect(j){let p=R[S.room][3][j],k=S.room+"-"+j;$("mh").textContent=p[0];$("mt").textContent=p[1];$("choices").innerHTML="";if(S.solved[k]){$("mt").textContent+=" ✓ Already solved.";open();return}p[3].forEach(c=>{let b=document.createElement("button");b.textContent=c;b.onclick=()=>{if(c===p[2]){S.solved[k]=1;S.inv.push(p[4]);$("speaker").textContent="Lullaby";$("dialog").textContent="YAY! You found "+p[4]+"! Cluck, cluck!";if(done(S.room)&&S.room<7){S.unlock=Math.max(S.unlock,S.room+2);$("dialog").textContent+=" Da next room is unlocked!";}if(done(7)&&S.room===7)$("dialog").textContent="YOU ESCAPED! Celebratory donuts for eberybody! 🍩🐔";save();close();render()}else $("mt").textContent="Nope! "+p[1]};$("choices").appendChild(b)});open()}
const open=()=>$("modal").classList.remove("hide"),close=()=>$("modal").classList.add("hide");function menu(){let x=$("roomList");x.innerHTML="";R.forEach((r,i)=>{let b=document.createElement("button"),ok=i<S.unlock;b.className=ok?"":"locked";b.textContent=(done(i)?"✓ ":"")+(ok?"🔓 ":"🔒 ")+(i+1)+". "+r[0];b.onclick=()=>{if(ok){S.room=i;$("roomMenu").classList.add("hide");render()}};x.appendChild(b)});$("roomMenu").classList.remove("hide")}
$("enter").onclick=()=>{if($("pw").value.trim().toLowerCase()==="chicken"){$("gate").classList.add("hide");$("app").classList.remove("hide");render()}else $("gm").textContent="Lullaby: “Dat is not da secret chippen word!”"};$("pw").onkeydown=e=>{if(e.key==="Enter")$("enter").click()};$("close").onclick=close;$("menu").onclick=menu;$("closeMenu").onclick=()=>$("roomMenu").classList.add("hide");$("back").onclick=()=>{if(S.room>0){S.room--;render()}};$("hint").onclick=()=>{let n=S.hints[S.room]||0;if(n>=3){$("dialog").textContent="No hints left in this room.";return}S.hints[S.room]=n+1;let j=R[S.room][3].findIndex((_,j)=>!S.solved[S.room+"-"+j]);$("speaker").textContent="Hint";$("dialog").textContent=j>=0?"Look closely at: "+R[S.room][3][j][0]+".":"Everything important here is solved!";render()};$("restart").onclick=()=>{if(confirm("Restart the whole game?")){localStorage.removeItem("lullabyEscape");S={room:0,unlock:1,solved:{},inv:[],hints:{}};$("roomMenu").classList.add("hide");render()}};
</script></body></html>
